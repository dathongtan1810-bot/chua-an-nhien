name: app-ci
on:
  push:
    paths: ['app/**', '.github/workflows/app-*.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app-*.yml']
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle size (initial load < 3 MB)
        run: node scripts/check-size.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
