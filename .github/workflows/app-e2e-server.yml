name: app-e2e-server
# E2E của app với server Socket.IO thật (thư mục server/ do phiên backend phụ trách).
on:
  push:
    paths: ['app/**', 'server/**', 'shared/**', '.github/workflows/app-e2e-server.yml']
  pull_request:
    paths: ['app/**', 'server/**', 'shared/**', '.github/workflows/app-e2e-server.yml']
  workflow_dispatch:
jobs:
  e2e-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build & start server
        working-directory: server
        run: |
          npm ci
          npm run build
          DB_PATH=$RUNNER_TEMP/can.db ADMIN_PASSWORD=ci-admin-pw PORT=8080 LOG_LEVEL=warn nohup npm start > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
      - name: App e2e against real server
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_SERVER_URL=http://localhost:8080 npm run e2e:server
      - name: Server log
        if: always()
        run: tail -100 $RUNNER_TEMP/server.log || true
