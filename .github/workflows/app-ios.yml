name: app-ios
# Build iOS (Capacitor 8, Swift Package Manager) cho Simulator — không ký, để kiểm tra dự án native biên dịch được.
# Bản phát hành App Store cần ký trên macOS với tài khoản Apple Developer (xem docs/app/PUBLISHING.md).
on:
  push:
    paths: ['app/**', '.github/workflows/app-ios.yml']
  workflow_dispatch:
concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: xcodebuild (iphonesimulator, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Debug-iphonesimulator/
      - uses: actions/upload-artifact@v4
        with:
          name: chua-an-nhien-ios-simulator-app
          path: app/build/Build/Products/Debug-iphonesimulator/App.app
