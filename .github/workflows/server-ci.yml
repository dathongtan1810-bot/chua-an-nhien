name: server-ci
on:
  push:
    paths: ['server/**', 'shared/**', 'admin/**', '.github/workflows/server-*.yml']
  pull_request:
    paths: ['server/**', 'shared/**', 'admin/**', '.github/workflows/server-*.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t chua-an-nhien-server .
